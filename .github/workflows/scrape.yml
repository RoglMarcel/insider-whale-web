name: Scrape & Publish (web)

# "Scrape-to-static": run the desktop app's scraper headlessly on GitHub's
# runner a few times a day, build the web UI with the fresh data baked in, and
# deploy it to GitHub Pages. No server, no cost, no phone battery used.
#
# The SQLite history DB is committed back to the repo (data/insider-tracker.db)
# so track-records / score-trend / "new signal" detection accumulate across runs.
#
# NOTE: GitHub cron is best-effort. Under load a scheduled run is delayed, and
# past a certain delay GitHub drops it entirely — we lost every slot between
# Fri 2026-08-28 and Mon 2026-08-31 and the site sat 3 days stale. So the
# schedule now knocks hourly on an odd minute (the top of the hour is the most
# contended, most-dropped slot) and the `gate` job below decides whether a
# knock actually scrapes. Any single delivered knock catches the site up.
on:
  workflow_dispatch: {}          # lets you run it manually from the Actions tab
  push:
    branches: [main]             # UI/code changes auto-rebuild + redeploy the site
    paths-ignore:                # ...but not for pure docs edits
      - '**/*.md'
  schedule:
    - cron: '23 13-21 * * 1-5'   # hourly across the US session (13:23–21:23 UTC)

# contents:write lets the run commit the updated history DB back to the repo.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs deploy at once; cancel an older run if a newer starts.
concurrency:
  group: scrape-publish
  cancel-in-progress: false

jobs:
  # Cheap staleness check so the hourly knock stays cheap. Skipped knocks cost
  # ~20s of a free public-repo runner; only a stale site pays for a full scrape.
  # Reads the LIVE site (public/data is gitignored, so the repo can't answer
  # this) and fails open — an unreachable site must never freeze publishing.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Is the published data stale?
        id: check
        env:
          MAX_AGE_MIN: '150'      # ~2.5h → still ~3–4 refreshes on a normal day
          META_URL: https://roglmarcel.github.io/insider-whale-web/data/meta.json
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "-> ${{ github.event_name }} run: always scrapes."
            exit 0
          fi
          GEN=$(curl -fsSL --max-time 20 "$META_URL" | sed -n 's/.*"generatedAt"[^"]*"\([^"]*\)".*/\1/p' | head -1)
          TS=$(date -u -d "$GEN" +%s 2>/dev/null || echo 0)
          if [ "$TS" = "0" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "-> could not read generatedAt from the live site: scraping anyway."
            exit 0
          fi
          AGE=$(( ( $(date -u +%s) - TS ) / 60 ))
          echo "live data generated $GEN — ${AGE}min old (threshold ${MAX_AGE_MIN}min)"
          if [ "$AGE" -ge "$MAX_AGE_MIN" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "-> stale: scraping."
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "-> fresh enough: skipping this knock."
          fi

  scrape-and-deploy:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the persist-step push is clean

      # Fast path for a desktop publish. The desktop app pushes its own scrape
      # into data/insider-tracker.db and marks the commit; those rows are richer
      # than a runner can produce (login-gated options flow needs a real
      # machine), so re-scraping here would burn minutes to publish something
      # WEAKER than what was just pushed. Detect the marker and skip the scrape.
      - name: Detect desktop publish
        id: mode
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "commit subject: $MSG"
          if printf '%s' "$MSG" | grep -qF '[desktop-publish]'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "-> desktop publish detected: skipping the cloud scrape."
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Skip the Electron-specific postinstall (electron-builder install-app-deps
      # rebuilds better-sqlite3 for Electron's ABI — wrong for plain Node here).
      - name: Install deps (no scripts)
        run: npm ci --ignore-scripts

      # Build better-sqlite3 for the Node ABI this runner uses. THIS is the one
      # fiddly step — if it ever fails, see the electron+xvfb fallback in the tutorial.
      - name: Build native SQLite for Node
        run: npm rebuild better-sqlite3 --build-from-source

      # Only the scraping path needs a browser; the desktop fast path just reads
      # SQLite and writes JSON, so skip a ~1-minute download it will never use.
      - name: Install Chromium for Playwright
        if: steps.mode.outputs.desktop != 'true'
        run: npx playwright install --with-deps chromium

      - name: Scrape → public/data/*.json
        if: steps.mode.outputs.desktop != 'true'
        env:
          # Optional: JSON map of login-gated session cookies (see README
          # "Login-gated sources"). Empty if the secret is not set → 🟢 sources only.
          SCRAPE_SESSIONS: ${{ secrets.SCRAPE_SESSIONS }}
        run: |
          export APP_VERSION="$(node -p "require('./package.json').version")"
          npm run scrape:web

      # Same two JSON files, straight out of the pushed DB — no scraping.
      - name: Publish desktop data → public/data/*.json
        if: steps.mode.outputs.desktop == 'true'
        run: |
          export APP_VERSION="$(node -p "require('./package.json').version")"
          npm run publish:data

      # Label ripened signals with realized SPY-relative alpha. This is what makes
      # the scoring model measurable over time; it only fills gaps, so it is cheap.
      - name: Label ripened outcomes (training data)
        if: steps.mode.outputs.desktop != 'true'
        run: npm run label:outcomes || echo "labeling failed — continuing (never blocks the site)"

      # Roll the testing portfolio forward and publish public/data/portfolio.json.
      # Runs AFTER labeling (which fills signal_outcomes, the portfolio's backfill
      # source) and BEFORE build:web (which bakes public/data into the bundle).
      # Never gates the deploy: a Yahoo timeout must not cost the site a release.
      - name: Sync testing portfolio
        run: npm run portfolio:sync || echo "portfolio sync failed — continuing (never blocks the site)"

      # Optional phone push: set the repo secret NTFY_TOPIC (any hard-to-guess
      # string) and subscribe to it in the ntfy Android app. No-op if unset.
      - name: Notify new signals (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set — skipping push."; exit 0; fi
          NEW=$(node -e "const m=require('./public/data/meta.json');const a=[...(m.newHighConviction||[]),...(m.newCombos||[]),...(m.newNotable||[]),...(m.scoreSurges||[]).map(s=>s&&s.ticker?s.ticker:s)];process.stdout.write([...new Set(a.filter(Boolean))].join(', '))")
          if [ -n "$NEW" ]; then
            curl -s -H "Title: New insider/whale signals" -H "Tags: chart_with_upwards_trend" \
              -d "New / surging tickers: $NEW" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null && echo "Notified: $NEW"
          else
            echo "No new notable signals this run."
          fi

      - name: Build web UI (bakes in public/data)
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Persist history AFTER a successful deploy so a persist hiccup never blocks
      # the site. [skip ci] stops this commit from re-triggering the workflow.
      - name: Persist history DB
        run: |
          [ -f data/insider-tracker.db ] || { echo "no DB to persist"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/insider-tracker.db
          if git diff --staged --quiet; then
            echo "DB unchanged — nothing to commit."
          else
            git commit -m "chore(data): update history DB [skip ci]"
            git push || echo "push rejected (concurrent run?) — will persist next run."
          fi
