name: Scrape & Publish (web)

# "Scrape-to-static": run the desktop app's scraper headlessly on GitHub's
# runner a few times a day, build the web UI with the fresh data baked in, and
# deploy it to GitHub Pages. No server, no cost, no phone battery used.
#
# NOTE: GitHub cron is UTC and can be delayed several minutes under load — fine
# for a few-times-a-day insider feed, not for an exact-minute trigger.
on:
  workflow_dispatch: {}          # lets you run it manually from the Actions tab
  push:
    branches: [main]             # UI/code changes auto-rebuild + redeploy the site
    paths-ignore:                # ...but not for pure docs edits
      - '**/*.md'
  schedule:
    - cron: '0 14 * * 1-5'       # ~US market open  (13:30–14:30 UTC across DST)
    - cron: '0 17 * * 1-5'       # ~midday
    - cron: '30 20 * * 1-5'      # ~after US close  (20:00–21:00 UTC across DST)

# Required for deploying to GitHub Pages from Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two runs deploy at once; cancel an older run if a newer starts.
concurrency:
  group: scrape-publish
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Skip the Electron-specific postinstall (electron-builder install-app-deps
      # rebuilds better-sqlite3 for Electron's ABI — wrong for plain Node here).
      - name: Install deps (no scripts)
        run: npm ci --ignore-scripts

      # Build better-sqlite3 for the Node ABI this runner uses. THIS is the one
      # fiddly step — if it ever fails, see the electron+xvfb fallback in the tutorial.
      - name: Build native SQLite for Node
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Scrape → public/data/*.json
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          export APP_VERSION="$(node -p "require('./package.json').version")"
          npm run scrape:web

      - name: Build web UI (bakes in public/data)
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
